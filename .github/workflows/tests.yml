name: Run tests
on:
    workflow_dispatch:
        inputs:
            test_pattern:
                description: The pattern to pass to npm test
                required: true
jobs:
    run-tests:
        name: Run Tests on (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest ]

        steps:
            - name: Setup Java
              uses: actions/setup-java@v1
              with:
                  java-version: 8
            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: 10
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Install dependencies and compile client
              run: |
                  npm install
                  npm run compile
            - name: Run Enterprise tests
              env:
                  HAZELCAST_ENTERPRISE_KEY: ${{ secrets.HAZELCAST_ENTERPRISE_KEY }}
              run: |
                  npm test ${{ github.event.inputs.test_glob }}
