name: Runs maintenance on branches
on:
    workflow_dispatch:
        inputs:
            test_pattern:
                description: The pattern to pass to npm test
                required: true
jobs:
    run-tests:
        runs-on: ${{ matrix.os }}
        name: Run tests of branch ${{ matrix.branch }} on ${{ matrix.os }} with Node ${{ matrix.nodejs_version }}
        strategy:
            matrix:
                branch: [ 5.0.x, 4.2.x, 4.1.x, 4.0.x ]
                os: [ ubuntu-latest, windows-latest ]
                nodejs_version: [ 10, 11, 12, 13, 14, 15, 16, 17 ]
            fail-fast: false
        steps:
            - name: Setup Java
              uses: actions/setup-java@v2
              with:
                  java-version: 8
                  distribution: temurin
            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: ${{ matrix.nodejs_version }}
            - name: Disable line ending conversion of git
              if: ${{ matrix.os == 'windows-latest'}}
              run: git config --global core.autocrlf false
            - name: Checkout code
              uses: actions/checkout@v2
              with:
                  ref: ${{ matrix.branch }}
            - name: Install dependencies and compile client
              run: |
                  npm install
                  npm run compile
            - name: Lint
              run: npm run lint
            - name: Validate User Code
              run: npm run validate-user-code
            - name: Run tests pre 4.2.x 
              if: ${{ matrix.branch == '4.0.x' || matrix.branch == '4.1.x' }}
              env:
                  HAZELCAST_ENTERPRISE_KEY: ${{ secrets.HAZELCAST_ENTERPRISE_KEY }}
              run: node download-remote-controller.js && npx mocha -g ${{ github.event.inputs.test_pattern }} --recursive test
            - name: Run tests 4.2.x and onwards
              if: ${{ matrix.branch == '4.2.x' || matrix.branch == '5.0.x' }}
              env:
                  HAZELCAST_ENTERPRISE_KEY: ${{ secrets.HAZELCAST_ENTERPRISE_KEY }}
              run: npm test ${{ github.event.inputs.test_pattern }}
